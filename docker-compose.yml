name: blog-cms

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  app:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_NAME: blog
      DB_USER: blog_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
      - data
      - monitoring
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    user: "101:101"
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
      - app_net
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
      - /tmp:size=8m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ABSOLUTE_URI: http://localhost:${PMA_PORT:-8081}/
      UPLOAD_LIMIT: 16M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
      - cadvisor
      - mysqld-exporter
      - nginx-exporter
    networks:
      - edge
      - monitoring
      - app_net
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - edge
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - app_net
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge:
  app_net:
    internal: true
  data:
    internal: true
  monitoring:
    internal: true
  egress:

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
